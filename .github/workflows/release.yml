name: Central Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release-infra:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout iconfigly-infra
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "iconfigly v${{ steps.meta.outputs.version }}"
          generate_release_notes: true

  propagate-release:
    needs: release-infra
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - iconfigly-api
          - iconfigly-web
          - iconfigly-docs
    steps:
      - name: Tag and dispatch ${{ matrix.repo }}
        env:
          PAT: ${{ secrets.CROSS_REPO_PAT }}
          OWNER: PathumSandeepa
          REPO: ${{ matrix.repo }}
          TAG: ${{ needs.release-infra.outputs.tag }}
          VERSION: ${{ needs.release-infra.outputs.version }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::CROSS_REPO_PAT secret is missing in iconfigly-infra. Add a GitHub PAT with 'repo' and 'workflow' scopes to propagate tags to ${OWNER}/${REPO}."
            exit 1
          fi

          API="https://api.github.com/repos/${OWNER}/${REPO}"
          AUTH="Authorization: Bearer ${PAT}"

          MAIN_SHA=$(curl -fsSL -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "${API}/git/ref/heads/main" | jq -r '.object.sha')

          if [ -z "$MAIN_SHA" ] || [ "$MAIN_SHA" = "null" ]; then
            echo "::error::Could not resolve main branch SHA for ${OWNER}/${REPO}"
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "${API}/git/refs" \
            -d "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${MAIN_SHA}\"}")

          if [ "$STATUS" = "201" ]; then
            echo "Created tag ${TAG} on ${OWNER}/${REPO}@${MAIN_SHA}"
          elif [ "$STATUS" = "422" ]; then
            curl -fsSL -X PATCH -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "${API}/git/refs/tags/${TAG}" \
              -d "{\"sha\":\"${MAIN_SHA}\",\"force\":true}" >/dev/null
            echo "Updated tag ${TAG} on ${OWNER}/${REPO}@${MAIN_SHA}"
          else
            echo "::error::Failed to create tag ${TAG} on ${OWNER}/${REPO} (HTTP ${STATUS})"
            exit 1
          fi

          curl -fsSL -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "${API}/dispatches" \
            -d "{\"event_type\":\"release\",\"client_payload\":{\"tag\":\"${TAG}\",\"version\":\"${VERSION}\"}}"
          echo "Dispatched release event for ${TAG} to ${OWNER}/${REPO}"
